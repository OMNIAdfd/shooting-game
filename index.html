<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>科幻射击游戏</title>
<style>
  body { margin: 0; background: #0a0a1a; display: flex; justify-content: center; align-items: center; height: 100vh; font-family: sans-serif; }
  canvas { background: #0d1b2a; border: 2px solid #1b263b; border-radius: 8px; }
</style>
</head>
<body>
<canvas id="game" width="480" height="640"></canvas>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

// 加载飞机图片
const imgPlayer = new Image();
imgPlayer.src = 'plane1-blue.png';
const imgEnemy1 = new Image();
imgEnemy1.src = 'plane2-red.png';
const imgEnemy2 = new Image();
imgEnemy2.src = 'plane3-purple.png';

let player, bullets, enemies, score, lives, gameOver, keys, lastShot;
let imagesLoaded = 0;

imgPlayer.onload = () => imagesLoaded++;
imgEnemy1.onload = () => imagesLoaded++;
imgEnemy2.onload = () => imagesLoaded++;

function init() {
  player = { x: canvas.width / 2 - 30, y: canvas.height - 60, w: 60, h: 50, speed: 7 };
  bullets = [];
  enemies = [];
  score = 0;
  lives = 3;
  gameOver = false;
  keys = {};
  lastShot = 0;
}

document.addEventListener('keydown', e => keys[e.code] = true);
document.addEventListener('keyup', e => keys[e.code] = false);

function spawnEnemy() {
  const useType = Math.random() > 0.5 ? 0 : 1;
  enemies.push({
    x: Math.random() * (canvas.width - 40),
    y: -40,
    w: 40, h: 35,
    speed: 0.6 + Math.random() * 0.7,
    type: useType
  });
}

function update() {
  if (gameOver) return;

  // 玩家移动
  if (keys['ArrowLeft'] || keys['KeyA']) player.x -= player.speed;
  if (keys['ArrowRight'] || keys['KeyD']) player.x += player.speed;
  player.x = Math.max(0, Math.min(canvas.width - player.w, player.x));

  // 自动射击
  const now = Date.now();
  if (now - lastShot > 200) {
    bullets.push({ x: player.x + player.w / 2 - 2, y: player.y, w: 5, h: 14, speed: 9 });
    lastShot = now;
  }

  // 子弹移动
  bullets = bullets.filter(b => { b.y -= b.speed; return b.y > -20; });

  // 敌人生成
  if (Math.random() < 0.012) spawnEnemy();

  // 敌人移动
  enemies = enemies.filter(e => {
    e.y += e.speed;
    if (e.y > canvas.height) {
      lives--;
      if (lives <= 0) gameOver = true;
      return false;
    }
    return true;
  });

  // 碰撞：子弹 vs 敌人
  bullets = bullets.filter(b => {
    for (let i = enemies.length - 1; i >= 0; i--) {
      const e = enemies[i];
      if (b.x < e.x + e.w && b.x + b.w > e.x && b.y < e.y + e.h && b.y + b.h > e.y) {
        enemies.splice(i, 1);
        score += 10;
        return false;
      }
    }
    return true;
  });

  // 碰撞：敌人 vs 玩家
  for (let i = enemies.length - 1; i >= 0; i--) {
    const e = enemies[i];
    if (player.x < e.x + e.w && player.x + player.w > e.x && player.y < e.y + e.h && player.y + player.h > e.y) {
      enemies.splice(i, 1);
      lives--;
      if (lives <= 0) gameOver = true;
    }
  }
}

function drawPlane(img, x, y, w, h) {
  if (imagesLoaded < 3) return;
  // 画飞机图片，白色背景用混合模式去掉
  ctx.save();
  ctx.globalCompositeOperation = 'source-over';
  // 先画一个深色底板衬托
  ctx.drawImage(img, x, y, w, h);
  ctx.restore();
}

function draw() {
  ctx.fillStyle = '#0d1b2a';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // 星空背景
  ctx.fillStyle = 'rgba(255,255,255,0.3)';
  for (let i = 0; i < 50; i++) {
    const sx = (i * 37) % canvas.width;
    const sy = (i * 53 + Date.now() * 0.02) % canvas.height;
    ctx.fillRect(sx, sy, 1, 1);
  }

  // 玩家飞机
  drawPlane(imgPlayer, player.x, player.y, player.w, player.h);

  // 子弹
  ctx.fillStyle = '#00d9ff';
  bullets.forEach(b => {
    ctx.shadowColor = '#00d9ff';
    ctx.shadowBlur = 8;
    ctx.fillRect(b.x, b.y, b.w, b.h);
  });
  ctx.shadowBlur = 0;

  // 敌人飞机
  enemies.forEach(e => {
    const img = e.type === 0 ? imgEnemy1 : imgEnemy2;
    drawPlane(img, e.x, e.y, e.w, e.h);
  });

  // 分数
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 20px sans-serif';
  ctx.fillText('分数: ' + score, 10, 30);

  // 生命值
  ctx.font = '16px sans-serif';
  ctx.fillText('生命: ' + '❤️'.repeat(Math.max(0, lives)), 10, 55);

  // 游戏结束
  if (gameOver) {
    ctx.fillStyle = 'rgba(0,0,0,0.8)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#e94560';
    ctx.font = 'bold 36px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('游戏结束', canvas.width / 2, canvas.height / 2 - 30);
    ctx.fillStyle = '#fff';
    ctx.font = '24px sans-serif';
    ctx.fillText('最终得分: ' + score, canvas.width / 2, canvas.height / 2 + 10);
    ctx.font = '16px sans-serif';
    ctx.fillText('按空格重新开始', canvas.width / 2, canvas.height / 2 + 50);
  }
}

function loop() {
  if (gameOver && keys['Space']) init();
  update();
  draw();
  requestAnimationFrame(loop);
}

init();
loop();
</script>
</body>
</html>
